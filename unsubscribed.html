<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribed</title>
<style>
  body { margin: 0; background: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .card { max-width: 420px; margin: 14vh auto 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 36px 32px; text-align: center; color: #1f2937; }
  h1 { font-size: 19px; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.6; color: #6b7280; margin: 0; }
</style>
</head>
<body>
  <div class="card"><h1 id="t"></h1><p id="m"></p></div>
  <script>
    // Landing page for the mail-unsubscribe edge function (it
    // 303-redirects here — the functions gateway serves text/plain, so
    // HTML can't be rendered from the function itself). ?t=ok|invalid.
    var ok = new URLSearchParams(location.search).get("t") === "ok";
    var x = ok
      ? ["You're unsubscribed", "You won't receive any more emails from this list. Changed your mind? Sign up again at the venue's website."]
      : ["Link not recognized", "This unsubscribe link is incomplete or expired."];
    document.getElementById("t").textContent = x[0];
    document.getElementById("m").textContent = x[1];
    document.title = x[0];
  </script>
</body>
</html>
