name: Deploy Supabase Edge Functions

# Deploys the edge functions to the CallidusCo Supabase project.
# Runs automatically when a function changes on main, or on manual dispatch.
# Requires one repo secret: SUPABASE_ACCESS_TOKEN
# (Supabase dashboard → Account → Access Tokens → generate).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_ID: ofliuuulagqlbdjwrnjc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy invoices-extract (JWT off — does its own auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invoices-extract --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy email-inbound (JWT off — verifies Svix signature)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy email-inbound --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
