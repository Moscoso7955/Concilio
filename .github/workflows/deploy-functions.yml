name: Deploy Supabase Edge Functions

# Deploys the edge functions to the CallidusCo Supabase project.
# Runs automatically when a function changes on main, or on manual dispatch.
# Requires one repo secret: SUPABASE_ACCESS_TOKEN
# (Supabase dashboard → Account → Access Tokens → generate).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

env:
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF || 'ofliuuulagqlbdjwrnjc' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Token avoids anonymous API rate limits when resolving "latest"
      # (an unauthenticated lookup made this job flake before).
      - uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: latest

      - name: Deploy invoices-extract (JWT off — does its own auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invoices-extract --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy email-inbound (JWT off — verifies Svix signature)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy email-inbound --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy pnl-extract (JWT off — does its own auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy pnl-extract --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy invite-user (JWT off — does its own admin auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy invite-user --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy doc-extract (JWT off — does its own auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy doc-extract --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy partner-feed (JWT off — link key is the credential)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy partner-feed --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy partner-sync (JWT off — does its own admin auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy partner-sync --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt

      - name: Deploy notify-distribution (JWT off — does its own admin auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy notify-distribution --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
