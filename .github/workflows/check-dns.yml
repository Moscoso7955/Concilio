name: Check Resend DNS records

# Verifies the DNS for the bills.callidusco.com inbound subdomain, plus
# sanity checks that the root domain's Google mail and www site records
# are untouched. Manual dispatch — run after adding records in Squarespace.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bills.callidusco.com records
        run: |
          fail=0
          echo "== 1. TXT resend._domainkey.bills.callidusco.com (DKIM) =="
          out=$(dig +short TXT resend._domainkey.bills.callidusco.com)
          echo "${out:-<missing>}"
          echo "$out" | grep -q "p=" || { echo "FAIL: DKIM TXT missing"; fail=1; }

          echo "== 2. MX send.bills.callidusco.com (return path) =="
          out=$(dig +short MX send.bills.callidusco.com)
          echo "${out:-<missing>}"
          echo "$out" | grep -qi "amazonses.com" || { echo "FAIL: send MX missing"; fail=1; }

          echo "== 3. TXT send.bills.callidusco.com (SPF) =="
          out=$(dig +short TXT send.bills.callidusco.com)
          echo "${out:-<missing>}"
          echo "$out" | grep -q "v=spf1" || { echo "FAIL: SPF TXT missing"; fail=1; }

          echo "== 4. MX bills.callidusco.com (INBOUND — the one that receives mail) =="
          out=$(dig +short MX bills.callidusco.com)
          echo "${out:-<missing>}"
          echo "$out" | grep -qi "inbound-smtp" || { echo "FAIL: inbound MX missing"; fail=1; }

          echo "== Sanity: root records untouched =="
          rootmx=$(dig +short MX callidusco.com)
          echo "root MX: ${rootmx:-<missing>}"
          echo "$rootmx" | grep -qi "google" || { echo "WARN: root MX no longer Google — christian@ mail at risk!"; fail=1; }
          echo "www CNAME: $(dig +short CNAME www.callidusco.com)"

          exit $fail
