name: Sync function secrets to Supabase

# Pushes repo-level secrets into the Supabase project's Edge Function
# secrets via the CLI, so nobody has to touch the Supabase dashboard.
# Currently syncs: RESEND_API_KEY. Manual dispatch only.

on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF || 'ofliuuulagqlbdjwrnjc' }}
    steps:
      # Token avoids anonymous API rate limits when resolving "latest".
      - uses: supabase/setup-cli@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: latest
      - name: Push RESEND_API_KEY to Supabase
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY repo secret is not set. Add it at Settings → Secrets and variables → Actions."
            exit 1
          fi
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$SUPABASE_PROJECT_ID"
          echo "Secret synced."
      - name: Verify
        run: supabase secrets list --project-ref "$SUPABASE_PROJECT_ID"
