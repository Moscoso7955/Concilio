<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ============================================
       1. WEB APP MANIFEST
       ============================================ -->
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0a192f">

  <!-- ============================================
       2. PAGE TITLE + SEO
       ============================================ -->
  <title>Concilio — Coming Soon</title>
  <meta name="description" content="Concilio is launching soon. Stay tuned for something extraordinary.">

  <!-- ============================================
       3. iMESSAGE / OPEN GRAPH PREVIEW
       ============================================ -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://concilio.com/">
  <meta property="og:title" content="Concilio — Coming Soon">
  <meta property="og:description" content="Something extraordinary is on its way. Stay tuned.">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card (also used by iMessage as fallback) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Concilio — Coming Soon">
  <meta name="twitter:description" content="Something extraordinary is on its way. Stay tuned.">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .coming-soon {
      --text: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      text-align: center;
    }

    .coming-soon__login {
      position: absolute;
      top: 1.5rem;
      right: 1.75rem;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      backdrop-filter: blur(6px);
      transition: background 0.15s, border-color 0.15s;
    }
    .coming-soon__login:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.5);
    }
    @media (max-width: 480px) {
      .coming-soon__login { top: 1rem; right: 1rem; padding: 0.45rem 0.85rem; }
    }

    .coming-soon__bg {
      --overlay: transparent;
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #0a192f center/cover no-repeat;
    }

    .coming-soon__bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--overlay);
    }

    .coming-soon__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      max-width: 600px;
    }


    .coming-soon__brand {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.7;
      animation: fadeIn 1.2s ease-out 0.2s both;
    }

    .coming-soon__headline {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: -0.02em;
      animation: fadeIn 1.2s ease-out 0.4s both;
    }

    .coming-soon__headline strong {
      font-weight: 700;
    }

    .coming-soon__tagline {
      font-size: 1.1rem;
      line-height: 1.6;
      opacity: 0.6;
      max-width: 440px;
      animation: fadeIn 1.2s ease-out 0.6s both;
    }

    .coming-soon__divider {
      width: 48px;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      border: none;
      animation: fadeIn 1.2s ease-out 0.8s both;
    }

    .coming-soon__footer {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.35;
      animation: fadeIn 1.2s ease-out 1s both;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 0.95; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @media (max-width: 480px) {
      .coming-soon__content { gap: 1.5rem; }
    }
  </style>
</head>
<body>

  <main class="coming-soon">
    <div class="coming-soon__bg"></div>

    <a class="coming-soon__login" href="/administration">
      Login
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
    </a>

    <div class="coming-soon__content">
      <span class="coming-soon__brand">Concilio</span>
      <p class="coming-soon__tagline">
        We're crafting an experience worth waiting for. Stay tuned.
      </p>
      <hr class="coming-soon__divider">
      <p class="coming-soon__footer">concilio.com</p>
    </div>
  </main>

  <!-- Dynamic content from Supabase (falls back to the static defaults above) -->
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/site.js"></script>

</body>
</html>
